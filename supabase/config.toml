# KârKalkan Supabase function configuration
# Source of truth for per-function JWT verification during handover/redeploy.

[functions.marketplace-connections]
verify_jwt = false

[functions.v4-auth]
verify_jwt = true

[functions.v4-beta]
verify_jwt = true

[functions.dashboard-summary]
verify_jwt = true

[functions.weekly-finance-summary]
verify_jwt = true

# Public status probe returns only runtime/database component state and no user data.
[functions.public-health]
verify_jwt = false

[functions.product-costs]
verify_jwt = true

[functions.trendyol-credentials]
verify_jwt = true

[functions.marketplace-credentials]
verify_jwt = true

[functions.marketplace-import]
verify_jwt = true

[functions.marketplace-import-fx]
verify_jwt = true

[functions.csv-schema-mapper]
verify_jwt = true

[functions.trendyol-sync]
verify_jwt = true

[functions.trendyol-resumable-sync]
verify_jwt = true

[functions.hepsiburada-sync]
verify_jwt = true

[functions.n11-sync]
verify_jwt = true

[functions.amazon-auth-start]
verify_jwt = true

[functions.amazon-auth-login]
verify_jwt = true

# Amazon redirects the seller here without a Supabase JWT. The callback uses
# a short-lived, one-use, SHA-256-hashed OAuth state before exchanging tokens.
[functions.amazon-auth-callback]
verify_jwt = false

[functions.amazon-sync]
verify_jwt = true

[functions.sync-history]
verify_jwt = true

[functions.connection-health]
verify_jwt = true

[functions.product-costs-bulk]
verify_jwt = true

[functions.trendyol-otherfinancials-sync]
verify_jwt = true

[functions.trendyol-cargo-sync]
verify_jwt = true

[functions.risk-alerts]
verify_jwt = true

[functions.webhook-manager]
verify_jwt = true

# External Trendyol callbacks do not carry a Supabase JWT.
# This function authenticates each callback with the per-connection x-api-key hash.
[functions.order-events]
verify_jwt = false

[functions.live-overview]
verify_jwt = true

[functions.decision-center]
verify_jwt = true

[functions.finance-ai]
verify_jwt = true

[functions.operating-expenses]
verify_jwt = true

[functions.portfolio-summary]
verify_jwt = true

[functions.billing-summary]
verify_jwt = true

[functions.billing-checkout]
verify_jwt = true

[functions.billing-portal]
verify_jwt = true

[functions.bank-reconciliation]
verify_jwt = true

[functions.product-analytics]
verify_jwt = true

[functions.account-delete]
verify_jwt = true

[functions.launch-readiness]
verify_jwt = true

[functions.trendyol-reconciliation]
verify_jwt = true

# Developer management endpoints require the signed-in user's Supabase JWT.
[functions.developer-api-keys]
verify_jwt = true

[functions.developer-webhooks]
verify_jwt = true

# Public API authenticates its own high-entropy, SHA-256-hashed kk_live_ keys.
# Supabase JWT verification must remain disabled or external server clients could not call it.
[functions.public-api-v1]
verify_jwt = false

# Paddle signs the exact raw body; it does not send a Supabase JWT.
[functions.billing-webhook]
verify_jwt = false
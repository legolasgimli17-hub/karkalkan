name: Developer Platform Patch Once

on:
  push:
    branches:
      - agent/developer-platform

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/developer-platform
          fetch-depth: 0
      - name: Patch transfer-safe CORS and sync webhook
        shell: python
        run: |
          from pathlib import Path

          root = Path('supabase/functions')
          personal = '-krgzabdullah22-8562s-projects.vercel.app'
          replacement = "Boolean(Deno.env.get('KARKALKAN_VERCEL_PREVIEW_HOST_SUFFIX'))&&u.hostname.endsWith(String(Deno.env.get('KARKALKAN_VERCEL_PREVIEW_HOST_SUFFIX')))"
          touched = 0
          for path in root.rglob('*.ts'):
              text = path.read_text()
              before = text
              text = text.replace(f"u.hostname.endsWith('{personal}')", replacement)
              text = text.replace(f'u.hostname.endsWith("{personal}")', replacement)
              if text != before:
                  path.write_text(text)
                  touched += 1

          resumable = Path('supabase/functions/trendyol-resumable-sync/index.ts')
          text = resumable.read_text()
          import_old = "import { resolveSyncRange } from '../_shared/sync-range.ts'\n"
          import_new = import_old + "import { deliverOutboundEvent } from '../_shared/outbound-webhooks.ts'\n"
          if "deliverOutboundEvent" not in text:
              if import_old not in text:
                  raise SystemExit('resumable import anchor missing')
              text = text.replace(import_old, import_new, 1)

          success_old = """      job.status = 'success'; job.completed_chunks = completedCount; job.safe_error_code = null\n      return json(200, { ok: true, chunk: { ...coreSummary, ...auxiliarySummary }, job: publicJob(job, { ...running, status: 'success' }) }, origin)"""
          success_new = """      job.status = 'success'; job.completed_chunks = completedCount; job.safe_error_code = null\n      await deliverOutboundEvent(sql, auth.user.id, 'sync.completed', {\n        marketplace: 'trendyol',\n        connectionId,\n        rangeStart: job.range_start,\n        rangeEnd: job.range_end,\n        importedTransactions,\n        completedChunks: completedCount,\n        totalChunks: Number(job.total_chunks)\n      }).catch(() => {})\n      return json(200, { ok: true, chunk: { ...coreSummary, ...auxiliarySummary }, job: publicJob(job, { ...running, status: 'success' }) }, origin)"""
          if "'sync.completed'" not in text:
              if success_old not in text:
                  raise SystemExit('resumable success anchor missing')
              text = text.replace(success_old, success_new, 1)
          resumable.write_text(text)

          workflow = Path('.github/workflows/developer-platform-patch-once.yml')
          workflow.unlink()
          print(f'patched copied CORS blocks in {touched} files')
      - name: Verify personal hostname removed
        run: |
          ! grep -R --line-number --fixed-strings 'krgzabdullah22-8562s-projects.vercel.app' supabase/functions .env.example
          grep -q "'sync.completed'" supabase/functions/trendyol-resumable-sync/index.ts
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions .github/workflows/developer-platform-patch-once.yml
          git commit -m "Make CORS transfer-safe and emit sync webhook"
          git push origin HEAD:agent/developer-platform

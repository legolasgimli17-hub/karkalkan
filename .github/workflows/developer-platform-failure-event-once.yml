name: Developer Platform Failure Event Once

on:
  push:
    branches:
      - agent/developer-platform

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/developer-platform
          fetch-depth: 0
      - name: Emit only terminal sync failures
        shell: python
        run: |
          from pathlib import Path
          path=Path('supabase/functions/trendyol-resumable-sync/index.ts')
          text=path.read_text()
          anchor="""      job.status = 'failed'; job.safe_error_code = code\n      return json"""
          replacement="""      job.status = 'failed'; job.safe_error_code = code\n      await deliverOutboundEvent(sql, auth.user.id, 'sync.failed', { marketplace: 'trendyol', connectionId, code }).catch(() => {})\n      return json"""
          count=text.count(anchor)
          if count != 2:
              raise SystemExit(f'expected 2 terminal failure anchors, found {count}')
          text=text.replace(anchor,replacement)
          path.write_text(text)
          Path('.github/workflows/developer-platform-failure-event-once.yml').unlink()
      - name: Verify patch
        run: |
          test "$(grep -c "'sync.failed'" supabase/functions/trendyol-resumable-sync/index.ts)" -eq 2
          git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/trendyol-resumable-sync/index.ts .github/workflows/developer-platform-failure-event-once.yml
          git commit -m "Emit terminal sync failure webhooks"
          git push origin HEAD:agent/developer-platform

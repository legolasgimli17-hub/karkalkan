name: Update Due Diligence Once

on:
  push:
    branches:
      - agent/developer-platform

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/developer-platform
          fetch-depth: 0
      - name: Update current capacity and developer-platform disclosure
        shell: python
        run: |
          from pathlib import Path
          path=Path('KNOWN_LIMITATIONS.md')
          text=path.read_text()
          marker='## 9. Very large-store synchronization — documented capacity boundary\n'
          if marker not in text:
              raise SystemExit('due diligence marker missing')
          before=text.split(marker,1)[0]
          replacement='''## 9. Very large-store synchronization — provider-specific status\n\nTrendyol now uses a persisted resumable synchronization job. A 7- or 30-day request is divided into bounded three-day chunks; job/chunk status, lease, retry state and completion evidence are stored server-side. A chunk is not successful until both core finance and required Other Financials/cargo/order-map evidence complete. Terminal provider failures stop fail-closed rather than silently truncating data. The browser can resume a persisted job after interruption.\n\nThis does **not** mean every marketplace worker is resumable. Hepsiburada, n11 and Amazon still deliberately stop at their provider/page safety ceilings and return an explicit failure instead of silently truncating data. Before representing those providers as suitable for very large stores, extend the same persisted job/cursor/idempotency pattern to each provider and validate it against an authorized merchant account. Raising page limits alone is not an acceptable substitute.\n\nProduction currently has no real Trendyol connection or large-store resumable run evidence. The architecture is implemented and deployed, but a buyer should run the real-store protocol before describing capacity as production-validated.\n\n## 10. Developer API and outbound webhooks — implemented, external adoption unproven\n\nKârKalkan includes scoped, revocable `kk_live_` API keys, a read-only Public API v1 and HMAC-SHA256 outbound webhooks. API-key hashes are stored server-side; webhook signing secrets are kept in Supabase Vault. Automatic events currently cover Trendyol resumable sync completion/final failure and matched seven-day Trendyol reconciliation, plus an explicit test event. See `docs/DEVELOPER_PLATFORM.md`.\n\nNo third-party client adoption or buyer-owned external webhook delivery has been documented yet. Do not present implementation as customer adoption, integration-partner approval or externally validated uptime. A buyer should create fresh keys/secrets after transfer and run an external signature-verification test.\n'''
          path.write_text(before+marker+replacement.split(marker,1)[-1] if replacement.startswith(marker) else before+replacement)
          Path('.github/workflows/update-due-diligence-once.yml').unlink()
      - name: Verify update
        run: |
          grep -q 'Trendyol now uses a persisted resumable synchronization job' KNOWN_LIMITATIONS.md
          grep -q 'Developer API and outbound webhooks' KNOWN_LIMITATIONS.md
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add KNOWN_LIMITATIONS.md .github/workflows/update-due-diligence-once.yml
          git commit -m "Update due diligence for resumable sync and developer API"
          git push origin HEAD:agent/developer-platform

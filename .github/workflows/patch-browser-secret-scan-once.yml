name: Patch Browser Secret Scan Once

on:
  push:
    branches:
      - agent/buyer-architecture-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/buyer-architecture-cleanup
          fetch-depth: 0
      - name: Make browser secret scan inventory dynamic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/repo-integrity.test.mjs')
          text = path.read_text()
          old_import = "import { readFile, access } from 'node:fs/promises';"
          new_import = "import { readFile, access, readdir } from 'node:fs/promises';"
          if old_import not in text and new_import not in text:
              raise SystemExit('node:fs/promises import anchor missing')
          text = text.replace(old_import, new_import)

          start_marker = "test('public browser code does not contain privileged Supabase secrets'"
          end_marker = "test('canonical seller route hides historical implementation filename'"
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('browser secret scan test boundaries not found')

          replacement = """test('public browser code does not contain privileged Supabase secrets',async()=>{const entries=await readdir(root,{withFileTypes:true}),browserFiles=entries.filter(entry=>entry.isFile()&&entry.name.endsWith('.js')).map(entry=>entry.name).sort(),forbidden=[/SUPABASE_SERVICE_ROLE_KEY/,/service_role/i,/SUPABASE_DB_URL/,/api_secret\\s*[:=]\\s*['\"][^'\"]+/i];assert.ok(browserFiles.length>=10,'expected browser JavaScript inventory');for(const file of browserFiles){const source=await read(file);for(const pattern of forbidden)assert.doesNotMatch(source,pattern,`${file} contains a privileged secret marker`)}});\n\n"""
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          Path('.github/workflows/patch-browser-secret-scan-once.yml').unlink()
          PY
      - name: Verify patch
        shell: bash
        run: |
          grep -q "readdir(root" tests/repo-integrity.test.mjs
          grep -q "entry.name.endsWith('.js')" tests/repo-integrity.test.mjs
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/repo-integrity.test.mjs .github/workflows/patch-browser-secret-scan-once.yml
          git commit -m "Make browser secret scan follow current source tree"
          git push origin HEAD:agent/buyer-architecture-cleanup

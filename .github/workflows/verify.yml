name: Verify KârKalkan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Complete test suite
        run: node --test tests/*.test.mjs

      - name: Browser and shared JavaScript syntax
        run: |
          node --check app-core.js
          node --check app-data.js
          node --check app-bulk.js
          node --check demo.js
          node --check v4.js
          node --check v4-security.js
          node --check v4-enhance.js
          node --check v4-alerts.js
          node --check vnext.js
          node --check vnext-visual.js
          node --check supabase/functions/_shared/finance.js

      - name: Edge Function TypeScript syntax and imports
        run: npx --yes esbuild@0.25.9 $(find supabase/functions -name '*.ts' -type f) --bundle --platform=neutral --format=esm --external:npm:* --external:https:* --outdir=/tmp/karkalkan-edge-build

name: Verify KârKalkan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Complete test suite
        run: node --test tests/*.test.mjs

      - name: Browser and shared JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z)
          node --check supabase/functions/_shared/finance.js

      - name: Edge Function TypeScript syntax and imports
        run: npx --yes esbuild@0.25.9 $(find supabase/functions -name '*.ts' -type f) --bundle --platform=neutral --format=esm --external:npm:* --external:https:* --outdir=/tmp/karkalkan-edge-build

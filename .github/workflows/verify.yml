name: Verify KârKalkan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repository integrity tests
        run: node --test tests/repo-integrity.test.mjs

      - name: Browser JavaScript syntax
        run: |
          node --check app-core.js
          node --check app-data.js
          node --check app-bulk.js
          node --check demo.js
          node --check v4.js
          node --check v4-security.js
          node --check v4-enhance.js
          node --check v4-alerts.js
